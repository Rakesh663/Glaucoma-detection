# ============================================================================
# Docker Compose - Simplified for Local Development
# For production, use Kubernetes manifests in k8s/
# ============================================================================

services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: glaucoma-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-glaucoma_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glaucoma_pass_changeme}
      POSTGRES_DB: ${POSTGRES_DB:-glaucoma_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - glaucoma-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glaucoma_user} -d ${POSTGRES_DB:-glaucoma_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # Redis - Caching & Rate Limiting
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: glaucoma-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_pass_changeme}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - glaucoma-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # Glaucoma Detection API
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glaucoma-api
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-glaucoma_user}:${POSTGRES_PASSWORD:-glaucoma_pass_changeme}@postgres:5432/${POSTGRES_DB:-glaucoma_db}
      DATABASE_POOL_SIZE: 20
      DATABASE_MAX_OVERFLOW: 10
      DATABASE_POOL_PRE_PING: "true"
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass_changeme}@redis:6379/0
      REDIS_CACHE_TTL: 3600
      # Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_this_super_secret_key_in_production}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
      # OAuth
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:8000/auth/callback}
      # API Config
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_WORKERS: 2
      API_RELOAD: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Circuit Breaker
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: 5
      CIRCUIT_BREAKER_TIMEOUT_SECONDS: 60
      # Rate Limiting
      RATE_LIMIT_PER_MINUTE: 60
      RATE_LIMIT_PER_HOUR: 1000
      # Monitoring
      ENABLE_METRICS: "true"
      ENABLE_TRACING: "true"
    volumes:
      - ./models:/app/models:ro
      - api_logs:/app/logs
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - glaucoma-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ==========================================================================
  # Prometheus - Metrics Collection
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: glaucoma-prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - glaucoma-network
    depends_on:
      - api
    restart: unless-stopped

  # ==========================================================================
  # Grafana - Visualization & Dashboards
  # ==========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: glaucoma-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - glaucoma-network
    depends_on:
      - prometheus
    restart: unless-stopped

# ============================================================================
# Networks
# ============================================================================
networks:
  glaucoma-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
