name: SonarQube Analysis

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=api \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --junitxml=pytest-report.xml
        continue-on-error: true

      - name: Fix coverage paths
        run: |
          # SonarQube expects relative paths
          sed -i 's|<source>/home/runner/work/glaucoma/glaucoma</source>|<source>.</source>|g' coverage.xml || true

      - name: SonarQube Scan (SonarCloud)
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=glaucoma-detection-api
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.python.xunit.reportPath=pytest-report.xml
            -Dsonar.sources=api
            -Dsonar.tests=tests
            -Dsonar.exclusions=**/migrations/**,**/tests/**,**/__pycache__/**
            -Dsonar.test.inclusions=**/test_*.py
            -Dsonar.python.version=3.11
        continue-on-error: true

      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v3
        with:
          name: coverage-reports
          path: |
            coverage.xml
            pytest-report.xml
            htmlcov/
          retention-days: 30

      - name: Generate summary
        if: always()
        run: |
          echo "## SonarQube Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View detailed results at: https://sonarcloud.io/project/overview?id=glaucoma-detection-api" >> $GITHUB_STEP_SUMMARY

  # Self-hosted SonarQube alternative
  sonarqube-self-hosted:
    name: SonarQube Self-Hosted Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=api \
            --cov-report=xml:coverage.xml \
            --junitxml=pytest-report.xml

      - name: Download SonarScanner
        run: |
          wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip -q sonar-scanner-cli-5.0.1.3006-linux.zip
          mv sonar-scanner-5.0.1.3006-linux sonar-scanner

      - name: Run SonarScanner
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./sonar-scanner/bin/sonar-scanner \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.projectKey=glaucoma-detection-api \
            -Dsonar.python.coverage.reportPaths=coverage.xml \
            -Dsonar.python.xunit.reportPath=pytest-report.xml

  # Additional code quality metrics
  code-quality-metrics:
    name: Code Quality Metrics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install analysis tools
        run: |
          pip install radon pylint flake8 mccabe

      - name: Run Pylint
        run: |
          echo "## Pylint Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          pylint api --exit-zero --output-format=text >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Calculate metrics
        run: |
          # Cyclomatic complexity
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Code Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cyclomatic Complexity" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          radon cc api -a -s >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Maintainability index
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Maintainability Index" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          radon mi api -s >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Raw metrics
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Raw Metrics (LOC, SLOC, Comments)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          radon raw api -s >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Generate quality badge data
        run: |
          # Calculate average maintainability index
          AVG_MI=$(radon mi api -s -j | jq '[.[] | .mi] | add / length' 2>/dev/null || echo "0")
          echo "AVERAGE_MI=$AVG_MI" >> $GITHUB_ENV

          # Calculate total lines of code
          TOTAL_LOC=$(radon raw api -s -j | jq '[.[] | .loc] | add' 2>/dev/null || echo "0")
          echo "TOTAL_LOC=$TOTAL_LOC" >> $GITHUB_ENV

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quality Metrics Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Average Maintainability Index**: $AVG_MI" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Lines of Code**: $TOTAL_LOC" >> $GITHUB_STEP_SUMMARY
