# Drift Detection Exceptions
# Define expected/allowed deviations from IaC definitions

apiVersion: v1
kind: Config
metadata:
  name: drift-exceptions
  description: |
    This file documents intentional deviations from Infrastructure as Code (IaC)
    definitions. Use this to prevent false positives in drift detection.

# Ignored resources
# Resources that are expected to exist in the cluster but not in IaC
ignoredResources:
  - kind: ConfigMap
    name: kube-root-ca.crt
    namespace: glaucoma
    reason: "Auto-generated by Kubernetes"

  - kind: Secret
    name: default-token-*
    namespace: glaucoma
    reason: "Auto-generated service account token"
    pattern: true

  - kind: Service
    name: kubernetes
    namespace: default
    reason: "Kubernetes API service"

# Ignored fields
# Fields that are expected to differ between IaC and cluster
ignoredFields:
  - resource: Deployment
    fields:
      - metadata.generation
      - metadata.resourceVersion
      - metadata.uid
      - metadata.creationTimestamp
      - metadata.managedFields
      - status
    reason: "Managed by Kubernetes"

  - resource: Service
    fields:
      - spec.clusterIP
      - spec.clusterIPs
      - metadata.resourceVersion
    reason: "Assigned by cluster"

  - resource: PersistentVolumeClaim
    fields:
      - status
      - spec.volumeName
    reason: "Managed by storage provisioner"

# Allowed modifications
# Specific changes that are permitted
allowedModifications:
  - resource: Deployment
    name: glaucoma-api
    namespace: glaucoma
    field: spec.replicas
    allowedValues: [1, 2, 3, 4, 5]
    reason: "HPA may scale replicas"
    managedBy: "HorizontalPodAutoscaler"

  - resource: ConfigMap
    name: prometheus-config
    namespace: monitoring
    field: data
    reason: "Updated by monitoring team"
    requiresApproval: true

  - resource: Ingress
    name: glaucoma-api-ingress
    namespace: glaucoma
    field: metadata.annotations
    pattern: "cert-manager.io/*"
    reason: "Managed by cert-manager"

# Temporary exceptions
# Time-limited exceptions for known drift
temporaryExceptions:
  - resource: Deployment
    name: glaucoma-api-canary
    namespace: glaucoma
    reason: "Canary deployment in progress"
    expires: "2025-12-31"
    createdBy: "devops-team"

# Environment-specific exceptions
# Drift that's expected in certain environments
environmentExceptions:
  production:
    - resource: Deployment
      name: glaucoma-api
      field: spec.template.spec.containers[0].resources.limits.memory
      reason: "Production uses higher memory limits"

  staging:
    - resource: Deployment
      name: glaucoma-api
      field: spec.template.spec.containers[0].resources.requests.cpu
      reason: "Staging uses lower resource requests"

# Alert thresholds
alerting:
  # Number of drift items before creating alert
  driftThreshold: 3

  # Severity levels
  severity:
    critical:
      - kind: Secret
        reason: "Security sensitive"
      - kind: Ingress
        field: spec.rules
        reason: "Exposes services externally"

    warning:
      - kind: ConfigMap
      - kind: Service

    info:
      - kind: Deployment
        field: metadata.labels

  # Notification channels
  notifications:
    slack:
      enabled: true
      channel: "#infrastructure-alerts"
      severity: ["critical", "warning"]

    email:
      enabled: false
      recipients: ["devops@example.com"]
      severity: ["critical"]

    github:
      enabled: true
      createIssue: true
      severity: ["critical"]

# Remediation policies
remediation:
  # Automatic remediation (use with caution!)
  automatic:
    enabled: false
    # Resources that can be automatically corrected
    allowedResources:
      - kind: ConfigMap
        name: app-config
        action: "apply"  # Apply IaC definition

  # Manual remediation workflow
  manual:
    enabled: true
    requiresApproval: true
    approvers: ["devops-lead", "platform-team"]

# Audit trail
audit:
  # Log all drift detections
  enabled: true
  retention: "90d"

  # Store drift reports
  storage:
    type: "s3"  # or "gcs", "azure-blob", "local"
    bucket: "glaucoma-drift-reports"
    prefix: "drift-reports/"

# Schedule
schedule:
  # Cron expression for automated checks
  cron: "0 */6 * * *"  # Every 6 hours

  # Enable continuous monitoring
  continuous:
    enabled: false
    interval: "5m"

# Integration with other tools
integrations:
  # ArgoCD integration
  argocd:
    enabled: false
    ignoreOutOfSync: true

  # Flux integration
  flux:
    enabled: false
    ignoreOutOfSync: true

  # Terraform Cloud
  terraform:
    enabled: false
    workspace: "glaucoma-infrastructure"

# Compliance
compliance:
  # Require all changes to be tracked
  requireChangeTicket: true

  # SOC 2 / ISO compliance
  auditAll: true

  # RBAC for drift management
  rbac:
    viewers: ["developer", "sre"]
    editors: ["platform-admin"]
    approvers: ["security-team", "platform-lead"]
