# SonarQube Project Configuration
# https://docs.sonarqube.org/latest/analysis/analysis-parameters/

# Project identification
sonar.projectKey=glaucoma-detection-api
sonar.projectName=Glaucoma Detection API
sonar.projectVersion=1.0.0

# Organization (for SonarCloud)
# sonar.organization=your-org-name

# Source code location
sonar.sources=api
sonar.tests=tests

# Python-specific settings
sonar.language=py
sonar.python.version=3.11

# Source encoding
sonar.sourceEncoding=UTF-8

# Paths to exclude from analysis
sonar.exclusions=\
  **/migrations/**,\
  **/tests/**,\
  **/__pycache__/**,\
  **/venv/**,\
  **/.venv/**,\
  **/htmlcov/**,\
  **/build/**,\
  **/dist/**,\
  **/*.egg-info/**,\
  **/.pytest_cache/**,\
  **/node_modules/**

# Test paths
sonar.test.inclusions=\
  **/test_*.py,\
  **/*_test.py

# Coverage reports
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=pytest-report.xml

# Pylint reports (if using pylint)
# sonar.python.pylint.reportPaths=pylint-report.txt

# Bandit security report
# sonar.python.bandit.reportPaths=bandit-report.json

# Code duplication
sonar.cpd.python.minimumTokens=50

# Quality gate conditions
# These define when the build should fail
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Code coverage requirements
sonar.coverage.exclusions=\
  **/tests/**,\
  **/conftest.py,\
  **/__init__.py,\
  **/migrations/**

# Issues to exclude
# E.g., exclude specific rules
# sonar.issue.ignore.multicriteria=e1,e2
# sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1192
# sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py

# Security hotspot rules
sonar.security.hotspots.enabled=true

# Code smells severity threshold
# Options: INFO, MINOR, MAJOR, CRITICAL, BLOCKER
sonar.issue.enforce.multicriteria=c1,c2

sonar.issue.enforce.multicriteria.c1.ruleKey=python:S1192
sonar.issue.enforce.multicriteria.c1.severity=MAJOR

sonar.issue.enforce.multicriteria.c2.ruleKey=python:S3776
sonar.issue.enforce.multicriteria.c2.severity=CRITICAL

# Custom rules configuration

# Python-specific quality rules
# Complexity threshold
sonar.python.complexity.threshold=15

# Cognitive complexity
sonar.python.cognitive.complexity.threshold=15

# Line length
sonar.python.line.length=120

# Logging
sonar.verbose=false
sonar.log.level=INFO

# SCM (Source Control Management)
sonar.scm.provider=git
sonar.scm.disabled=false

# Links
sonar.links.homepage=https://github.com/your-org/glaucoma-detection-api
sonar.links.ci=https://github.com/your-org/glaucoma-detection-api/actions
sonar.links.issue=https://github.com/your-org/glaucoma-detection-api/issues
sonar.links.scm=https://github.com/your-org/glaucoma-detection-api

# Working directory for analysis
sonar.working.directory=.scannerwork

# Branch analysis
# sonar.branch.name=main
# sonar.branch.target=main

# Pull request analysis
# sonar.pullrequest.key=123
# sonar.pullrequest.branch=feature/my-feature
# sonar.pullrequest.base=main
