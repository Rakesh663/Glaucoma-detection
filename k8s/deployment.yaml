---
# ============================================================================
# Glaucoma Detection API - Kubernetes Deployment
# Production-ready deployment with HPA, PVC, and security best practices
# ============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: glaucoma-detection

---
# ============================================================================
# ConfigMap for Application Configuration
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: glaucoma-api-config
  namespace: glaucoma-detection
data:
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_WORKERS: "2"
  LOG_LEVEL: "info"
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"
  # Database
  DATABASE_POOL_SIZE: "20"
  DATABASE_MAX_OVERFLOW: "10"
  DATABASE_POOL_PRE_PING: "true"
  # Circuit Breaker
  CIRCUIT_BREAKER_FAILURE_THRESHOLD: "5"
  CIRCUIT_BREAKER_TIMEOUT_SECONDS: "60"
  # Rate Limiting
  RATE_LIMIT_PER_MINUTE: "60"
  RATE_LIMIT_PER_HOUR: "1000"

---
# ============================================================================
# Secret for Sensitive Data (Base64 encoded)
# IMPORTANT: Replace these with actual secrets in production!
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: glaucoma-api-secret
  namespace: glaucoma-detection
type: Opaque
data:
  # These are example values - MUST be replaced in production
  # To encode: echo -n 'your-value' | base64
  JWT_SECRET_KEY: Y2hhbmdlX3RoaXNfc3VwZXJfc2VjcmV0X2tleV9pbl9wcm9kdWN0aW9u
  POSTGRES_PASSWORD: Z2xhdWNvbWFfcGFzc193b3JkXzEyMzQ1Ng==
  REDIS_PASSWORD: cmVkaXNfcGFzc193b3JkXzEyMzQ1Ng==

---
# ============================================================================
# PersistentVolumeClaim for Model Storage
# ============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glaucoma-model-pvc
  namespace: glaucoma-detection
spec:
  accessModes:
    - ReadOnlyMany  # Multiple pods can read the model
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard  # Adjust based on your cluster

---
# ============================================================================
# Deployment for Glaucoma Detection API
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glaucoma-api
  namespace: glaucoma-detection
  labels:
    app: glaucoma-api
    version: v1
spec:
  replicas: 3  # Start with 3 replicas, HPA will adjust
  selector:
    matchLabels:
      app: glaucoma-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime deployments
  template:
    metadata:
      labels:
        app: glaucoma-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # Security context for the pod
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

      # Init container to wait for dependencies
      initContainers:
        - name: wait-for-postgres
          image: busybox:latest
          command: ['sh', '-c', 'until nc -z postgres-primary 5432; do echo waiting for postgres; sleep 2; done']

        - name: wait-for-redis
          image: busybox:latest
          command: ['sh', '-c', 'until nc -z redis 6379; do echo waiting for redis; sleep 2; done']

      containers:
        - name: glaucoma-api
          image: glaucoma-api:latest  # Replace with your image registry
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # Environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: glaucoma-api-config

          # Environment variables from Secret
          env:
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: glaucoma-api-secret
                  key: JWT_SECRET_KEY

            - name: DATABASE_URL
              value: postgresql://glaucoma_user:$(POSTGRES_PASSWORD)@postgres-primary:5432/glaucoma_db

            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379/0

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glaucoma-api-secret
                  key: POSTGRES_PASSWORD

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glaucoma-api-secret
                  key: REDIS_PASSWORD

          # Volume mounts
          volumeMounts:
            - name: model-storage
              mountPath: /app/models
              readOnly: true

          # Resource limits and requests
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"

          # Liveness probe
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          # Readiness probe
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          # Security context for the container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # FastAPI needs to write logs
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: glaucoma-model-pvc

      # Pod disruption budget for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - glaucoma-api
                topologyKey: kubernetes.io/hostname

---
# ============================================================================
# Service for Glaucoma Detection API
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: glaucoma-api-service
  namespace: glaucoma-detection
  labels:
    app: glaucoma-api
spec:
  type: ClusterIP
  selector:
    app: glaucoma-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  sessionAffinity: ClientIP  # Sticky sessions

---
# ============================================================================
# HorizontalPodAutoscaler for API
# ============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: glaucoma-api-hpa
  namespace: glaucoma-detection
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: glaucoma-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max

---
# ============================================================================
# Ingress for External Access
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glaucoma-api-ingress
  namespace: glaucoma-detection
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.glaucoma-detection.com  # Replace with your domain
      secretName: glaucoma-api-tls
  rules:
    - host: api.glaucoma-detection.com  # Replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: glaucoma-api-service
                port:
                  number: 80
